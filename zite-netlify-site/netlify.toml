[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[dev]
  command = "npm run dev"
  targetPort = 5173
  port = 8888
  autoLaunch = false

# Client-side routing: send all non-file requests to index.html.
# Requests to /.netlify/functions/* are routed to Functions before this
# rule is ever consulted, so it's safe to leave as a catch-all.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
